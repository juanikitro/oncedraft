services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: draft
      POSTGRES_USER: draft
      POSTGRES_PASSWORD: draft_development_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - draft_postgres_data:/var/lib/postgresql/data

volumes:
  draft_postgres_data:
